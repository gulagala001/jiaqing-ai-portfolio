<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PromptLab 提示词审阅样本 · 王家庆</title>
<style>
:root{
  --bg:#0d0f14; --panel:#141821; --panel-2:#1a1f2b; --line:#232937;
  --ink:#e8ecf4; --ink-dim:#9aa5b8; --ink-faint:#65708a;
  --a:#6aa9ff; --b:#ffc46a; --c:#6ee7a8; --warn:#ff7b7b; --ok:#5ddc9a;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65;
     -webkit-font-smoothing:antialiased}

/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:30;background:rgba(13,15,20,.94);backdrop-filter:blur(14px);
       border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding:13px 22px}
.brand{font-size:15px;font-weight:650;letter-spacing:.3px;white-space:nowrap}
.brand span{color:var(--ink-faint);font-weight:400;margin-left:9px;font-size:12.5px}
.stat{color:var(--ink-dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}
.grow{flex:1}
input.search{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:7px 12px;font-size:13px;width:230px;font-family:inherit;transition:.15s}
input.search:focus{outline:none;border-color:var(--a);width:300px}
button.act{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;
  padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
button.act:hover{border-color:var(--a);color:var(--ink)}

/* ── 分类条 ── */
.cats{display:flex;gap:7px;padding:0 22px 12px;flex-wrap:wrap}
.cat{border:1px solid var(--line);background:transparent;color:var(--ink-dim);border-radius:999px;
  padding:4.5px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.cat:hover{border-color:var(--ink-faint);color:var(--ink)}
.cat.on{background:var(--a);border-color:var(--a);color:#07101f;font-weight:600}
.cat .n{opacity:.62;margin-left:6px;font-variant-numeric:tabular-nums}

/* ── 主体 ── */
main{padding:20px 22px 120px;max-width:1780px;margin:0 auto}
.group{margin:34px 0 14px;display:flex;align-items:baseline;gap:12px}
.group h2{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.group .desc{color:var(--ink-faint);font-size:12.5px;flex:1}
.group .rule{height:1px;background:var(--line);flex:0 0 auto;width:0}

.row{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:16px;
     background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:13px;
     overflow:hidden;transition:border-color .18s}
.row:hover{border-color:#2e3648}
.row.noted{border-color:#3a4a6b}
.left{padding:15px 17px;min-width:0;border-right:1px solid var(--line)}
.right{padding:15px 16px;display:flex;flex-direction:column;gap:9px;background:var(--panel-2);min-width:0}

.meta{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:11px;padding:2.5px 9px;border-radius:6px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.title{font-size:13.5px;font-weight:640;color:var(--ink)}
.src{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:auto;white-space:nowrap}
.src:hover{color:var(--ink-dim)}

.en{font-family:var(--mono);font-size:12.4px;line-height:1.72;white-space:pre-wrap;word-break:break-word;
    color:#cdd6e6;background:#0f131b;border:1px solid #1d2432;border-radius:8px;padding:12px 14px;margin:0}
.zh{font-size:13.3px;line-height:1.82;color:var(--ink-dim);white-space:pre-wrap;word-break:break-word;
    margin:11px 0 0;padding:11px 14px 11px 15px;border-left:2.5px solid #334464;
    background:#111621;border-radius:0 8px 8px 0}
.zh.missing{color:var(--ink-faint);font-style:italic;border-left-color:#2a2f3d}
.clip{max-height:250px;overflow:hidden;position:relative}
.clip::after{content:'';position:absolute;inset:auto 0 0 0;height:64px;
  background:linear-gradient(transparent,#0f131b)}
.zh.clip::after{background:linear-gradient(transparent,#111621)}
.more{background:none;border:none;color:var(--a);font-size:12px;cursor:pointer;padding:6px 0 0;
      font-family:inherit}
.more:hover{text-decoration:underline}

.right label{font-size:11.5px;color:var(--ink-faint);letter-spacing:.4px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px}
.saved{color:var(--ok);font-size:11px;opacity:0;transition:opacity .25s;text-transform:none;letter-spacing:0}
.saved.on{opacity:1}
textarea{flex:1;min-height:132px;background:#0f131b;border:1px solid #1d2432;border-radius:8px;
  color:var(--ink);padding:11px 13px;font-family:inherit;font-size:13.2px;line-height:1.7;resize:vertical;
  transition:border-color .15s}
textarea:focus{outline:none;border-color:var(--a)}
textarea::placeholder{color:#3d4657}

/* ── 总留言 ── */
.global{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(13,15,20,.97);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:11px 22px;
  display:flex;gap:13px;align-items:flex-start;max-height:46vh}
.global textarea{min-height:52px;max-height:34vh;flex:1}
.global .side{display:flex;flex-direction:column;gap:7px;width:180px;flex:0 0 auto}
.global label{font-size:11.5px;color:var(--ink-faint);letter-spacing:.4px}
.hint{color:var(--ink-faint);font-size:11.5px;line-height:1.55}
.empty{text-align:center;color:var(--ink-faint);padding:70px 0;font-size:13.5px}
kbd{background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}

:root{--bg:#111214;--panel:#191a1d;--panel-2:#212225;--line:#ffffff24;--ink:#f4f1ec;--ink-dim:#b3adb3;--ink-faint:#a198a2;--a:#ffac85}header{background:#111214f5}.intro{max-width:1200px;margin:0 auto;padding:35px 30px 22px}.intro a{color:#c0b8bf;text-decoration:none;font-size:12px}.kicker{font-size:11px;letter-spacing:.16em;color:#ffac85;margin:29px 0 12px}.intro h1{font-weight:450;font-size:34px;line-height:1.4;letter-spacing:-.03em;margin:12px 0 18px}.intro p{color:#b3adb3}.intro .scope{max-width:940px;color:#b3adb3;font-size:12px;line-height:1.85}.bar{flex-wrap:wrap;gap:12px}.src{white-space:normal;overflow-wrap:anywhere}.en,textarea{background:#131519;border-color:#ffffff18}.zh{background:#1b1d22}.clip::after{background:linear-gradient(transparent,#131519)}.zh.clip::after{background:linear-gradient(transparent,#1b1d22)}.global{background:#111214f5}.global textarea{min-height:52px}.brand span{display:none}.row{grid-template-columns:minmax(0,1.4fr) minmax(250px,1fr)}.group{flex-wrap:wrap}.group .desc{min-width:220px}.cat{font-size:11px}.cat.on{color:#191a1d}input.search:focus{width:300px}#exportPreview{margin:20px 0}#exportPreview textarea{width:100%;height:240px;margin-top:15px}.intro .scope summary{cursor:pointer}.intro .scope p{margin-top:12px}#storageStatus:empty{display:none}#storageStatus{font-size:11px;color:#d4ba9f;min-height:18px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #ffac85;outline-offset:4px}@media(max-width:700px){.intro{padding:25px 20px 16px}.intro h1{font-size:27px}.bar{padding:12px 16px}.brand{width:100%}.stat{font-size:11px}.grow{display:none}input.search,input.search:focus{width:100%}.cats{padding:0 16px 10px;flex-wrap:nowrap;overflow:auto}.cats .cat{flex-shrink:0}.bar button.act{font-size:11px;padding:7px 10px}main{padding:10px 16px 145px}.row{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line)}.right textarea{min-height:105px}.global{padding:9px 16px;gap:10px}.global .side{width:85px}.hint{font-size:10px}.global textarea{min-width:0}.group .desc{font-size:11px}.en{font-size:11px}.zh{font-size:13px}}
</style>
</head>
<body>
<div class="intro"><a href="../index.html#samples">← 王家庆作品集</a><p class="kicker">TRISOUL / WORK SAMPLE</p><h1>把提示词变成可审阅的工作材料。</h1><p>从项目现有PromptLab提取的交互样本：原文、中文对照、来源、批注与导出。代码主要由AI辅助完成。</p><details class="scope"><summary>数据来源与保存方式</summary><p>这是156条历史抽取快照，其中106条有匹配中文对照；不宣称覆盖当前全部源码。原始批注文件为空，页面不会预填本人历史意见。你写的内容只保存于当前浏览器，不提交到服务器、不改项目源码。</p></details><details id="exportPreview" hidden><summary>查看导出内容</summary><textarea id="exportText" readonly aria-label="导出内容"></textarea></details><p id="storageStatus" role="status"></p></div><header>
  <div class="bar">
    <div class="brand">PromptLab<span>原文与修改意见</span></div>
    <div class="stat" id="stat">载入中…</div>
    <div class="grow"></div>
    <input class="search" id="q" aria-label="搜索提示词" placeholder="搜索原文 / 译文 / 批注…" autocomplete="off">
    <button class="act" id="onlyNoted">只看已批注</button>
    <button class="act" id="expandAll">全部展开</button>
    <button class="act" id="export">导出批注</button>
  </div>
  <div class="cats" id="cats"></div>
</header>

<main id="main"><div class="empty">载入中…</div></main>

<div class="global">
  <div class="side">
    <label>总留言 · 大改动方向</label>
    <div class="hint">总留言随批注一起导出。自动保存到本浏览器。</div>
  </div>
  <textarea aria-label="总留言" id="gnote" placeholder="总体修改目标、必须保留的约束和优先级…"></textarea>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s)
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e }

// 分类元数据：色、名、说明。顺序即页面分组顺序。
const CATS = [
  ['unclassified','#a9a1a5','尚未分类','快照中新出现、尚无匹配分类与中文对照的条目。'],
  ['persona',   '#ff9d6a', '人设 · 官位补偿人设',   '三官位（对齐/博识/实证）× 三档（轻/标准/猛）。运行时按 effort 选一份，写进该魂的 system。'],
  ['envelope',  '#6aa9ff', '信封四格',                  'findings / plan / action / output —— 每步交稿的固定结构，字段说明本身就是提示词。'],
  ['submit',    '#7fd1ff', '交稿工具 submit_draft',     '唯一交付通道的 schema 与字段描述：actions / files / edits / lookup。'],
  ['format',    '#a08fff', '交稿格式与铁律',            '两条路线（工具路线 / JSON 路线）各自的格式块、示例与「不得在信封外发工具调用」的规则。'],
  ['discipline','#ff8fb1', '交付纪律（硬性要求）',      'Delivery discipline 全文——每条回复必须交稿，以及违反后的纠错话术。'],
  ['tools',     '#6ee7a8', '工具说明与官位专属工具',    '工具分类总述，加 task_original / run_verify / web_search 三件专属工具的说明。'],
  ['vote',      '#ffc46a', '互投表决',                  '选票工具、评判尺度、候选稿呈现方式、以及「不得因文风否决」的护栏。'],
  ['memory',    '#c8a2ff', '记忆中枢',                  '记忆书记官：事件流消化、分层写入、定期整理（curation）。'],
  ['canvas',    '#5fd4d4', '画布状态区',                '画布书记官：钉住区与状态区的重写规则、快照格式。'],
  ['probe',     '#88c0d0', '探针问答',                  '手术后的忠实性探针——抽查压缩前后事实是否一致。'],
  ['surgeon',   '#e0a3a3', '上下文手术刀',              '把一段事件压缩成忠实记录的指令，含 checkpoint 合并与「计划未执行」的处理。'],
  ['guard',     '#ff7b7b', '安全门',                    '危险命令拦截后回流给模型的理由。'],
  ['runtime',   '#8a94a8', '运行时消息',                '工具返回、错误提示、格式纠错——模型会读到，但不是静态提示词。'],
  ['legacy',    '#5a6478', '兜底 / 已被覆盖',           'patch.yml 里的静态 persona 等：正常路径下会被官位人设覆盖，留着当默认值。'],
]
CATS.push(CATS.shift());
const CAT = Object.fromEntries(CATS.map(([k, c, n, d]) => [k, { color: c, name: n, desc: d }]))

let DATA = { prompts: [], tr: {}, notes: {} }
let filter = { cat: 'persona', q: '', noted: false }
let expanded = new Set()

const catOf = (p) => DATA.tr[p.id]?.category || 'unclassified'
const titleOf = (p) => DATA.tr[p.id]?.title || p.anchor || '(未命名)'

function matches(p) {
  if (filter.cat && catOf(p) !== filter.cat) return false
  if (filter.noted && !DATA.notes[p.id]?.text) return false
  if (filter.q) {
    const hay = (p.text + ' ' + (DATA.tr[p.id]?.zh || '') + ' ' + titleOf(p) + ' ' +
                 (DATA.notes[p.id]?.text || '') + ' ' + p.file).toLowerCase()
    if (!hay.includes(filter.q.toLowerCase())) return false
  }
  return true
}

function render() {
  const main = $('#main')
  main.innerHTML = ''
  const list = DATA.prompts.filter(matches)
  if (!list.length) { main.append(el('div', 'empty', '没有匹配的条目')); return }

  // 按分类分组，组内按原文长度降序——长的通常是主干，先看主干
  for (const [key, color, name, desc] of CATS) {
    const items = list.filter((p) => catOf(p) === key).sort((a, b) => b.chars - a.chars)
    if (!items.length) continue
    const g = el('div', 'group')
    const h = el('h2', null, name)
    h.style.color = color
    g.append(h, el('div', 'desc', desc))
    main.append(g)
    for (const p of items) main.append(rowFor(p, color))
  }
}

function rowFor(p, color) {
  const row = el('div', 'row')
  if (DATA.notes[p.id]?.text) row.classList.add('noted')

  // ── 左：原文 + 译文 ──
  const left = el('div', 'left')
  const meta = el('div', 'meta')
  const tag = el('span', 'tag', CAT[catOf(p)]?.name.split(' · ')[0] || catOf(p))
  tag.style.background = color + '22'; tag.style.color = color
  const src = el('span', 'src', `${p.file.replace(/^packages\//, '')}:${p.line}`)
  src.title = p.file + ':' + p.line
  meta.append(tag, el('span', 'title', titleOf(p)), src)
  left.append(meta)

  const isOpen = expanded.has(p.id)
  const en = el('pre', 'en' + (isOpen || p.chars <= 420 ? '' : ' clip'), p.text)
  left.append(en)

  const zhText = DATA.tr[p.id]?.zh
  const zh = el('div', 'zh' + (zhText ? '' : ' missing') + (isOpen || !zhText || zhText.length <= 420 ? '' : ' clip'),
                zhText || '（此条尚未译出）')
  left.append(zh)

  if (p.chars > 420) {
    const btn = el('button', 'more', isOpen ? '收起 ▲' : '展开全文 ▼')
    btn.onclick = () => { isOpen ? expanded.delete(p.id) : expanded.add(p.id); render() }
    left.append(btn)
  }

  // ── 右：批注 ──
  const right = el('div', 'right')
  const lab = el('label', null, '批注 / 改写意见')
  const saved = el('span', 'saved', '已保存')
  lab.append(saved)
  const ta = el('textarea')
  ta.setAttribute('aria-label','批注：'+titleOf(p))
  ta.placeholder = '这条要怎么改？删掉？换写法？先记在这儿…'
  ta.value = DATA.notes[p.id]?.text || ''
  ta.oninput = () => saveNote(p.id, ta.value, saved, row)
  right.append(lab, ta)

  row.append(left, right)
  return row
}

const STORAGE='jiaqing-promptlab-job-v1';
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(DATA.notes));$('#storageStatus').textContent='批注保存在本浏览器。'}catch{$('#storageStatus').textContent='当前浏览器无法持久保存；请在离开页面前导出批注。'}}
function saveNote(id,text,savedEl,row){if(text.trim())DATA.notes[id]={text};else delete DATA.notes[id];persist();if(row)row.classList.toggle('noted',!!text.trim());if(savedEl){savedEl.textContent='已记录';savedEl.classList.add('on')}stat()}

function stat() {
  const n = DATA.prompts.length
  const chars = DATA.prompts.reduce((s, p) => s + p.chars, 0)
  const tr = DATA.prompts.filter((p) => DATA.tr[p.id]?.zh).length
  const noted = Object.keys(DATA.notes).filter((k) => k !== '__global').length
  $('#stat').innerHTML = `<b>${n}</b> 条 · <b>${chars.toLocaleString()}</b> 字符 · 已译 <b>${tr}</b> · 已批注 <b>${noted}</b>`
}

function renderCats() {
  const box = $('#cats'); box.innerHTML = ''
  const all = el('button', 'cat' + (filter.cat ? '' : ' on'))
  all.innerHTML = `全部<span class="n">${DATA.prompts.length}</span>`
  all.onclick = () => { filter.cat = null; renderCats(); render() }
  box.append(all)
  for (const [key, color, name] of CATS) {
    const n = DATA.prompts.filter((p) => catOf(p) === key).length
    if (!n) continue
    const b = el('button', 'cat' + (filter.cat === key ? ' on' : ''))
    b.innerHTML = `${name.split(' · ')[0]}<span class="n">${n}</span>`
    if (filter.cat === key) { b.style.background = color; b.style.borderColor = color; b.style.color = '#07101f' }
    b.onclick = () => { filter.cat = filter.cat === key ? null : key; renderCats(); render() }
    box.append(b)
  }
}

async function boot() {
  DATA = await (await fetch('./prompt-data.json')).json();try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))DATA.notes=saved}catch{}
  stat(); renderCats(); render()
  const g = $('#gnote')
  g.value = DATA.notes.__global?.text || ''
  g.oninput = () => saveNote('__global', g.value, null, null)
}

$('#q').oninput = (e) => { filter.q = e.target.value.trim(); filter.cat=null;renderCats();render() }
$('#onlyNoted').onclick = (e) => {
  filter.noted = !filter.noted;filter.cat=null;renderCats()
  e.target.textContent = filter.noted ? '看全部' : '只看已批注'
  e.target.style.color = filter.noted ? 'var(--a)' : ''
  render()
}
$('#expandAll').onclick = (e) => {
  if (expanded.size) { expanded.clear(); e.target.textContent = '全部展开' }
  else { DATA.prompts.forEach((p) => expanded.add(p.id)); e.target.textContent = '全部收起' }
  render()
}
function exportMarkdown(){let out='# PromptLab 修改意见\n\n本文件由当前浏览器批注生成，不代表王家庆既有历史决策。\n';if(DATA.notes.__global?.text)out+='\n## 总体方向\n'+DATA.notes.__global.text+'\n';for(const p of DATA.prompts){const note=DATA.notes[p.id]?.text;if(!note)continue;out+='\n## '+titleOf(p)+'\n\n来源：'+p.file+':'+p.line+'（历史快照）\n\n### 原文\n'+p.text+'\n\n### 修改意见\n'+note+'\n'}return out}
$('#export').onclick=()=>{const text=exportMarkdown();$('#exportText').value=text;$('#exportPreview').hidden=false;$('#exportPreview').open=true;const link=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));link.href=url;link.download='PromptLab-修改意见.md';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('#exportPreview').scrollIntoView({behavior:'smooth',block:'center'})};
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();persist()}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});

boot()
</script>
</body>
</html>
